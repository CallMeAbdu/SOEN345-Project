appId: com.soen345.project
---
# Sign out if already signed in
- runFlow:
    when:
      visible: "Sign Out"
    commands:
      - tapOn: "Sign Out"
      - waitForAnimationToEnd
      - assertVisible: "Sign In"

- assertVisible: "Sign In"
- tapOn:
    id: "emailInput"
- inputText: "${email}"
- tapOn:
    id: "passwordInput"
- inputText: "${password}"
- tapOn:
    id: "authButton"
- waitForAnimationToEnd
